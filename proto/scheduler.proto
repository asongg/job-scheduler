syntax = "proto3";

package scheduler;

service Scheduler {
  rpc RegisterWorker (RegisterWorkerRequest) returns (RegisterWorkerResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
  rpc RequestJob (RequestJobRequest) returns (RequestJobResponse);
  rpc ReportResult (ReportResultRequest) returns (ReportResultResponse);
  rpc SubmitJob (SubmitJobRequest) returns (SubmitJobResponse);
  rpc RequestJobs (RequestJobsRequest) returns (RequestJobsResponse);
  rpc ReportResults (ReportResultsRequest) returns (ReportResultsResponse);
  rpc SubmitJobs (SubmitJobsRequest) returns (SubmitJobsResponse);
  rpc ExtendLease (ExtendLeaseRequest) returns (ExtendLeaseResponse);
  rpc ExtendLeases (ExtendLeasesRequest) returns (ExtendLeasesResponse);
  rpc ListFailedJobs (ListFailedJobsRequest) returns (ListFailedJobsResponse);
  rpc ReplayFailedJob (ReplayFailedJobRequest) returns (ReplayFailedJobResponse);
}

message RegisterWorkerRequest {
  string workerId = 1;
  int32 capacity = 2;
}

message RegisterWorkerResponse {
  bool ok = 1;
  int64 heartbeatIntervalMs = 2;
  int64 heartbeatTimeoutMs = 3;
}

message HeartbeatRequest {
  string workerId = 1;
  int32 runningJobs = 2;
}

message HeartbeatResponse {
  bool ok = 1;
}

message RequestJobRequest {
  string workerId = 1;
}

message RequestJobsRequest {
  string workerId = 1;
  int32 maxJobs = 2;
}

message Job {
  string jobId = 1;
  string idempotencyKey = 2;
  string payload = 3;
  string attemptId = 4;
  int64 leaseExpiresAtMs = 5;
}

message RequestJobResponse {
  bool hasJob = 1;
  Job job = 2;
}

message RequestJobsResponse {
  repeated Job jobs = 1;
}

message ReportResultRequest {
  string workerId = 1;
  string jobId = 2;
  string idempotencyKey = 3;
  bool success = 4;
  string output = 5;
  int64 durationMs = 6;
  string attemptId = 7;
}

message ReportResultResponse {
  bool ok = 1;
}

message ReportResultsRequest {
  repeated ReportResultRequest results = 1;
}

message ReportResultsResponse {
  repeated ReportResultResponse results = 1;
}

message ExtendLeaseRequest {
  string workerId = 1;
  string jobId = 2;
  string idempotencyKey = 3;
  string attemptId = 4;
}

message ExtendLeaseResponse {
  bool ok = 1;
  int64 leaseExpiresAtMs = 2;
}

message ExtendLeasesRequest {
  repeated ExtendLeaseRequest leases = 1;
}

message ExtendLeasesResponse {
  repeated ExtendLeaseResponse results = 1;
}

message SubmitJobRequest {
  string idempotencyKey = 1;
  string payload = 2;
}

message SubmitJobResponse {
  bool ok = 1;
  string jobId = 2;
}

message SubmitJobsRequest {
  repeated SubmitJobRequest jobs = 1;
}

message SubmitJobsResponse {
  repeated SubmitJobResponse results = 1;
}

message FailedJob {
  string jobId = 1;
  string idempotencyKey = 2;
  string payload = 3;
  int32 attempts = 4;
  string lastFailureReason = 5;
}

message ListFailedJobsRequest {
  int32 limit = 1;
}

message ListFailedJobsResponse {
  repeated FailedJob jobs = 1;
}

message ReplayFailedJobRequest {
  string jobId = 1;
  bool preserveAttempts = 2;
}

message ReplayFailedJobResponse {
  bool ok = 1;
  string jobId = 2;
}
